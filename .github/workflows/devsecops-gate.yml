# Sentinel Stacks — DevSecOps CI gate
#
# This lab repo intentionally contains vulnerable demo code, so the LIVE
# checkout scan is REPORT-ONLY (artifact still shows real gate pass/fail).
# The MOCK self-test is the required proof that the gate fails on criticals.
#
# Customer app repos: remove the "exit 0" wrapper on the live job so critical
# DEVSEC-* findings fail the PR.

name: DevSecOps Gate

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  gate-repo-live:
    name: DevSecOps gate (live report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run DevSecOps gate on checkout (report-only for lab)
        run: |
          set +e
          python worker_gate.py \
            --role devsecops \
            --target . \
            --fail-on critical \
            --report-out gate-devsecops-live.json
          code=$?
          set -e
          echo "live_gate_exit=$code"
          if [ -f gate-devsecops-live.json ]; then
            python -c "import json; r=json.load(open('gate-devsecops-live.json')); print(r.get('message')); print('blockers', r.get('blocker_count'))"
          fi
          echo "::notice::Lab repo live gate is report-only (intentional demo vulns). See artifact for real result. Customer apps should fail the job on exit!=0."
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-devsecops-live
          path: gate-devsecops-live.json

  gate-selftest-mock:
    name: Gate self-test (mock must FAIL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Expect critical findings to fail the gate
        run: |
          set +e
          python worker_gate.py \
            --role devsecops \
            --mock \
            --fail-on critical \
            --report-out gate-devsecops-mock.json
          code=$?
          set -e
          echo "exit_code=$code"
          if [ "$code" -eq 0 ]; then
            echo "Self-test FAILED: mock vulnerable pack should not pass critical gate"
            exit 1
          fi
          echo "Self-test OK: gate correctly failed on critical DEVSEC findings"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-devsecops-mock
          path: gate-devsecops-mock.json
